# Baut bei jedem Tag vX.Y bzw. vX.Y.Z die signierte Release-APK und legt das GitHub-Release an.
# Benötigte Repository-Secrets: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Zertifikat von BlitzLink 1.0 – mit einem anderen Schlüssel ließe sich die APK nicht als Update installieren
      EXPECTED_CERT: "0B:70:D8:86:2A:45:09:CB:0F:E2:F4:81:6F:FD:CF:0B:9C:8B:F1:B6:42:CD:10:62:A5:59:83:34:1D:41:20:A8"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 fehlt"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Testen und bauen
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion="$GITHUB_REF_NAME"

      - name: Signatur prüfen
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="BlitzLink-$VERSION.apk"
          WEAR_APK="BlitzLink-Wear-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp wear/build/outputs/apk/release/wear-release.apk "$WEAR_APK"
          # Handy- und Uhr-App brauchen denselben Schlüssel, sonst finden sie sich nicht
          for f in "$APK" "$WEAR_APK"; do
            # Build-Tools-Version, die AGP 8.13 für den Build installiert
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$f" | tee "$RUNNER_TEMP/apksigner.txt"
            CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" \
              | tr a-f A-F | sed 's/../&:/g; s/:$//')
            if [ "$CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::Falsches Signatur-Zertifikat in $f: $CERT"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "WEAR_APK=$WEAR_APK" >> "$GITHUB_ENV"
          echo "CERT=$CERT" >> "$GITHUB_ENV"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          WEAR_SHA=$(sha256sum "$WEAR_APK" | cut -d' ' -f1)
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "> Inoffizielle App, nicht mit Opel oder Stellantis verbunden."
            echo
            if [ -n "$PREV" ]; then
              echo "### Änderungen"
              git log --no-merges --pretty='- %s' "$PREV..$TAG"
              echo
              echo "Alle Änderungen: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
              echo
            fi
            echo "### Installation"
            echo "\`$APK\` herunterladen und auf dem Smartphone öffnen (Installation aus unbekannten Quellen erlauben). Mindestens Android 8.0."
            echo
            echo "Optional für die Uhr (Wear OS 3 oder neuer): \`$WEAR_APK\` per ADB installieren – Anleitung in der [README](https://github.com/$GITHUB_REPOSITORY#wear-os)."
            echo
            echo "### Prüfsummen"
            echo "- Signatur-Zertifikat (SHA-256): \`$CERT\`"
            echo "- APK (SHA-256): \`$SHA\`"
            echo "- Wear-APK (SHA-256): \`$WEAR_SHA\`"
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$WEAR_APK" --clobber
          else
            gh release create "$TAG" "$APK" "$WEAR_APK" --title "BlitzLink $VERSION" --notes-file notes.md
          fi
